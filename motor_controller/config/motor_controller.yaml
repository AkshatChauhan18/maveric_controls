# Go-kart (Ackermann) bridge to the ESP32 in experimenting/.
# Everything below the port is a physical property of the vehicle
# while the node is running.
motor_controller:
  ros__parameters:
    port: /dev/ttyUSB0
    baud: 115200

    # Geometry / limits. MEASURE THESE.
    wheelbase: 1.20            # m, front axle to rear axle
    max_steer_angle: 0.52      # rad of road wheel at steering = +-100 (encoder +-20000)
    max_speed: 1.5             # m/s reached at throttle = 100. Open loop, calibrate against GPS.
    max_angular_z: 1.0         # rad/s that maps to full lock below ackermann_min_speed
    ackermann_min_speed: 0.2   # m/s below which angular.z is treated as a direct steering request
    speed_deadband: 0.02       # m/s treated as "no drive requested"
    invert_steering: false     # flip if +angular.z steers the wrong way
    brake_on_zero_cmd: false   # true = also brake tiny positive speeds inside speed_deadband

    # Slew limits, percent per control tick (5.0 at 20 Hz = 100 %/s).
    throttle_accel_limit: 5.0
    throttle_decel_limit: 100.0   # instant release: this is the brake pedal
    steer_slew_limit: 15.0

    # Steering input filter: EMA time constant in seconds.
    # 0.0 = disabled. Typical: 0.05–0.2. Higher = smoother but more lag.
    steer_filter_tau: 0.1

    # teleop_twist_keyboard only emits on key events; 750 ms accommodates
    # keyboard auto-repeat delay while still braking after input is lost.
    cmd_timeout_ms: 750.0
    control_rate_hz: 20.0
    debug_serial: false
